<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Tick</title>
<style>
  :root {
    --color-primary: #cb3cff;
    --color-secondary2: #00c2ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0d0d0d;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: sans-serif;
  }

  .scene {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }

  .tick-wrapper {
    position: relative;
    width: 120px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Glowing ring */
  .ring {
    position: absolute;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: conic-gradient(
      var(--color-primary),
      var(--color-secondary2),
      var(--color-primary)
    );
    animation: spin 2s linear infinite, fadeInRing 0.4s ease forwards;
    opacity: 0;
  }

  .ring::after {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: #0d0d0d;
  }

  /* Glow pulse */
  .glow {
    position: absolute;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(203,60,255,0.25) 0%, rgba(0,194,255,0.1) 60%, transparent 80%);
    animation: pulse 1.8s ease-in-out infinite;
    animation-delay: 0.6s;
  }

  /* SVG tick */
  .tick-svg {
    position: relative;
    z-index: 2;
    width: 60px;
    height: 60px;
    overflow: visible;
  }

  .tick-path {
    fill: none;
    stroke: url(#tickGrad);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 80;
    stroke-dashoffset: 80;
    animation: drawTick 0.55s cubic-bezier(0.4, 0, 0.2, 1) 0.5s forwards;
    filter: drop-shadow(0 0 6px var(--color-primary));
  }

  /* Particle bursts */
  .particles {
    position: absolute;
    width: 0;
    height: 0;
    top: 50%;
    left: 50%;
  }

  .particle {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    opacity: 0;
    animation: burst 0.6s ease-out 1.05s forwards;
  }

  .particle:nth-child(1)  { background: var(--color-primary);    --tx: -55px; --ty: -20px; }
  .particle:nth-child(2)  { background: var(--color-secondary2); --tx:  55px; --ty: -20px; }
  .particle:nth-child(3)  { background: var(--color-primary);    --tx:   0px; --ty: -62px; }
  .particle:nth-child(4)  { background: var(--color-secondary2); --tx:  48px; --ty:  38px; }
  .particle:nth-child(5)  { background: var(--color-primary);    --tx: -48px; --ty:  38px; }
  .particle:nth-child(6)  { background: var(--color-secondary2); --tx:  28px; --ty: -58px; }
  .particle:nth-child(7)  { background: var(--color-primary);    --tx: -28px; --ty: -58px; }
  .particle:nth-child(8)  { background: var(--color-secondary2); --tx:  62px; --ty:  10px; }

  /* Label */
  .label {
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 0.5s ease 1.1s forwards;
    background: linear-gradient(90deg, var(--color-primary), var(--color-secondary2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 700;
  }

  /* --- Keyframes --- */
  @keyframes drawTick {
    to { stroke-dashoffset: 0; }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes fadeInRing {
    to { opacity: 1; }
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1);   opacity: 0.6; }
    50%       { transform: scale(1.3); opacity: 1;   }
  }

  @keyframes burst {
    0%   { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Replay button */
  .replay-btn {
    margin-top: 10px;
    padding: 8px 22px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(90deg, var(--color-primary), var(--color-secondary2));
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    opacity: 0;
    animation: fadeUp 0.5s ease 1.4s forwards;
    transition: transform 0.15s;
  }
  .replay-btn:hover { transform: scale(1.06); }
</style>
</head>
<body>

<div class="scene">
  <div class="tick-wrapper" id="wrapper">
    <div class="glow"></div>
    <div class="ring"></div>

    <svg class="tick-svg" viewBox="0 0 60 60">
      <defs>
        <linearGradient id="tickGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#cb3cff"/>
          <stop offset="100%" stop-color="#00c2ff"/>
        </linearGradient>
      </defs>
      <polyline class="tick-path" points="10,30 24,46 50,16"/>
    </svg>

    <div class="particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>
  </div>

  <div class="label">Success</div>
  <button class="replay-btn" onclick="replay()">↺ Replay</button>
</div>

<script>
function replay() {
  const wrapper = document.getElementById('wrapper');
  // Clone and re-insert to restart animations
  const clone = wrapper.cloneNode(true);
  wrapper.parentNode.replaceChild(clone, wrapper);
}
</script>
</body>
</html>
