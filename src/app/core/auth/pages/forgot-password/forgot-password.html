<auth-page-design [authFormTitle]="flag ? forgotPasswordPageTitle2 : forgotPasswordPageTitle1"
    [authFormSubtitle]="flag ? forgotPasswordPageSubtitle2 : forgotPasswordPageSubtitle2">
    @if(!flag){
    <!-- email input -->
    <app-generic-input [config]="forgotEmailConfig" [(ngModel)]="email" [hasError]="emailLengthGetter"
        [isValid]="!emailLengthGetter" />
    <!-- acount search button -->
    <div class="flex justify-center my-5">
        <app-submit-button btnType="button" [btnDisable]="emailLengthGetter" (btnClick)="checkEmail()"
            [btntext]="findAccountBtnText" />
    </div>
    <!-- login page route -->
    <app-auth-form-footer [linkLabel]="loginLinkLabel" [routeLink]="loginLinkRoute" [linkName]="loginLinkText" />
    <!-- password reset form -->
    } @else {
    <!-- password input -->
    <app-generic-input [config]="forgotPasswordConfig" [(ngModel)]="password" [hasError]="passwordLengthGetter"
        [isValid]="!passwordLengthGetter" [passwordStrength]="passwordStrengthGetter"
        [passwordStrengthColor]="passwordStrengthColorGetter"
        [passwordStrengthProgress]="passwordStrengthProgressGetter"></app-generic-input>
    <!-- confirm Password input -->
    <app-generic-input [config]="forgotConfirmPasswordConfig" [(ngModel)]="cnfrmPassword"
        [hasError]="cnfrmPasswordLengthGetter" [isInvalid]="passmatch" [isValid]="!passmatch" />
    <!-- password reset button -->
    <div class="flex justify-center my-5">
        <app-submit-button btnType="button"
            [btnDisable]="passwordLengthGetter || cnfrmPasswordLengthGetter || passmatch" (btnClick)="passReset()"
            [btntext]="passResetbtnText" />
    </div>

    }
</auth-page-design>
