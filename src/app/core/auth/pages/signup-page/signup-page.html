<auth-page-design [authFormTitle]="signupPageTitle" [authFormSubtitle]="signupPageSubtitle">

    <form [formGroup]="signupForm" (ngSubmit)="onSignupSubmit()">
        <!-- username input -->
        <div class="scroll-container overflow-y-auto scroll-auto h-64 mt-2 px-5 lg:px-8">
            <app-generic-input [config]="userNameConfig" formControlName="username"
                [hasError]="username?.hasError('required') && username?.touched"
                [isInvalid]="username?.hasError('maxlength') || username?.hasError('minlength')"
                [isValid]="!!username?.valid" />
            <!-- email input -->
            <app-generic-input [config]="emailConfig" formControlName="email"
                [hasError]="email?.hasError('required') && email?.touched" [isInvalid]="email?.hasError('email')"
                [isValid]="!!email?.valid" />
            <!-- Password input -->
            <app-generic-input [config]="passwordConfig" formControlName="password"
                [hasError]="password?.hasError('required') && password?.touched" [isValid]="!!password?.valid"
                [passwordStrength]="passwordStrengthGetter" [passwordStrengthColor]="passwordStrengthColorGetter"
                [passwordStrengthProgress]="passwordStrengthProgressGetter"></app-generic-input>
            <!-- confirm password input -->
            <app-generic-input [config]="confirmPasswordConfig" formControlName="c_password"
                [hasError]="c_password?.hasError('required') && c_password?.touched"
                [isInvalid]="c_password?.hasError('mustMatch')" [isValid]="!!c_password?.valid" />

        </div>
        <!-- signup button -->
        <div class="flex justify-center my-5">
            <app-submit-button btnType="submit" [btnDisable]="sigupBtnDisabled" [btntext]="signupBtnText" />
        </div>
        <!-- login form link -->
        <app-auth-form-footer [linkLabel]="loginLinkLabel" [routeLink]="loginLinkRoute" [linkName]="loginLinkText" />
    </form>
</auth-page-design>
