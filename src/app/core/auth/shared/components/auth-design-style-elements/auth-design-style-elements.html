<div class="page" style="isolation: isolate;">

    <!-- futurustic animation -->
     <app-auth-design-style-elements1></app-auth-design-style-elements1>
    <!-- <ng-container [ngTemplateOutlet]="futurusticAnimation"></ng-container> -->

    <!-- ngrx animation -->
    <app-auth-design-style-elements2></app-auth-design-style-elements2>

    <!-- content to show inside -->
    <ng-content></ng-content>

    <!-- <ng-container [ngTemplateOutlet]="futurecard"></ng-container> -->
</div>

<ng-template #futurecard>
    <!-- Auth Card -->
    <div class="card">
        <div class="corner-tl"></div>
        <div class="corner-tr"></div>
        <div class="corner-bl"></div>
        <div class="corner-br"></div>

        <div class="card-header">
            <div>
                <div class="card-title">Sign in to your account</div>
                <div class="card-sub">Welcome back — enter your credentials</div>
            </div>
            <button class="lang-btn">EN</button>
        </div>

        <div class="divider"></div>

        <div class="field-label">Email</div>
        <input class="field-input" type="email" placeholder="you@example.com" />

        <div class="field-label">Password</div>
        <input class="field-input" type="password" placeholder="••••••••" />

        <button class="btn-primary">AUTHENTICATE</button>

        <div class="footer-link">No account? <a href="#">Create one</a></div>
    </div>
</ng-template>
