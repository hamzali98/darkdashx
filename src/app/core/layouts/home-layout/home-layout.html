<app-auth-design-style-elements2></app-auth-design-style-elements2>
<div class="flex w-full h-screen backdrop-blur-xs ">
<!-- bg-primary-bg -->
    @if(isSidebarOpen && isMobile){
    <div class="fixed inset-0 bg-black/25 z-40 xl:hidden" (click)="closeSidebar()">
    </div>
    }

    <div class="absolute xl:relative z-50 transition-transform duration-300 ease-in-out h-full shrink-0 overflow-clip"
        [ngClass]="isSidebarOpen ? 'w-71' : 'w-0'" [class.xl:w-71]="!isMobile"
        [class.-translate-x-full]="!isSidebarOpen && isMobile && !isRtl"
        [class.translate-x-full]="!isSidebarOpen && isMobile && isRtl"
        [class.translate-x-0]="isSidebarOpen || !isMobile" [class.left-0]="!isRtl" [class.right-0]="isRtl">
        <app-generic-side-bar [navData]="sideCols"></app-generic-side-bar>
    </div>
    <div class="flex relative flex-col w-full ">
        <div class="static z-40 w-full bg-primary-bg ">
            <app-header class="xl:hidden"></app-header>
        </div>
        <div class=" static overflow-y-auto scroll-container">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
