<!-- products basic details form -->
<app-form-style 
formTitle="BASIC_INFO" 
formSubtitle="PROD_INFO_DESC"
>
    <form [formGroup]="baseInfo">
        <!-- product name input -->
        <app-generic-input formControlName="product_name" [config]="productNameConfig"
            [hasError]="product_name?.hasError('required') && !!product_name?.touched"
            [isValid]="!!product_name?.valid" />
        <!-- product category select -->
        <app-generic-input formControlName="product_category" [config]="productCategoryConfig"
            [hasError]="product_category?.hasError('required') && !!product_category?.touched"
            [isValid]="!!product_category?.valid" />
        <!-- product price input -->
        <app-generic-input formControlName="product_price" [config]="productPriceConfig"
            [hasError]="product_price?.hasError('required') && product_price?.touched"
            [isValid]="!!product_price?.valid" />
        <!-- product company select -->
        <app-generic-input formControlName="product_company" [config]="productCompanyConfig"
            [hasError]="product_company?.hasError('required') && !!product_company?.touched"
            [isValid]="!!product_company?.valid" />
    </form>
</app-form-style>
