<form [formGroup]="detailInfo" (ngSubmit)="onFormSubmit()">
    <app-form-style formTitle="DETAILED_INFO" formSubtitle="PROD_INFO_DESC">
        <!-- product expiry -->
        <app-generic-input formControlName="product_expiry" [config]="productExpiryConfig"
            [hasError]="product_expiry?.hasError('required') && !!product_expiry?.touched"
            [isValid]="!!product_expiry?.valid" />
        <!-- product reg. no -->
        <app-generic-input formControlName="product_regno" [config]="productRegConfig"
            [hasError]="product_regno?.hasError('required') && product_regno?.touched"
            [isValid]="!!product_regno?.valid" />
        <!-- product MFG -->
        <app-generic-input formControlName="product_mfg" [config]="productMfgConfig"
            [hasError]="product_mfg?.hasError('required') && !!product_mfg?.touched" [isValid]="!!product_mfg?.valid" />
        <!-- product stock -->
        <app-generic-input formControlName="product_stock" [config]="productStockConfig"
            [hasError]="product_stock?.hasError('required') && product_stock?.touched"
            [isValid]="!!product_stock?.valid" />
    </app-form-style>
    <div class="lg:pr-10.5 flex gap-2 justify-end mt-10">
        <button type="button" class="h-11 w-45.5 rounded-sm text-primary cursor-pointer border border-primary
            font-worksans text-[15px]" (click)="onCancel()" >
            {{"CANCEL" | translate}}
        </button>
        <button type="submit" [disabled]="detailInfo.invalid" class="h-11 w-45.5 rounded-sm text-white bg-primary cursor-pointer
            disabled:bg-primary/50 disabled:text-white/50 font-worksans text-[15px] disabled:cursor-not-allowed"
            type="submit">
            {{productFormEditing ? ("EDIT_PRODUCT" | translate) : ("ADD_PRODUCT" | translate)}}
        </button>
    </div>
</form>
