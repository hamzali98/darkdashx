<app-generic-view-page pageTitle="TITLE" route="/products/add" buttonTitle="ADD_PRODUCT"
    [(genericSearchKey)]="parentSearchKey">
    <!-- upper card -->
    <div class="flex flex-col flex-wrap md:flex-row justify-between pt-6.5">
        <app-totals-cards [icon]="'assets/icons/colored/totalproducts.svg'" [title]="('Total Products' | translate)"
            [counts]="productData().length" />
        <app-totals-cards [icon]="'assets/icons/colored/newproducts.svg'" [title]="('New Products' | translate)" [counts]="13" />
        <app-totals-cards [icon]="'assets/icons/colored/topusersgreen.svg'" [title]="('Top Products' | translate)" [counts]="65" />
        <app-totals-cards [icon]="'assets/icons/colored/otherusersblue.svg'" [title]="('Other Products' | translate)" [counts]="93" />
    </div>
    <!-- generic table -->
    <div class="mt-4.5">
        <app-generic-table [(searchTerm)]="parentSearchKey" (onDeleteClicked)="deleteProductData($event)"
            (deleteAllClicked)="deleteAllProductsData($event)" (onEditClicked)="editproductData($event)"
            tableName="{{ 'TITLE' | translate }}" [columns]="productTableConfigGetter" [tableData]="productData()" />
    </div>
</app-generic-view-page>
