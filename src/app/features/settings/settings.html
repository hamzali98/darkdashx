 <!-- settings.html -->
<div class="p-8">
  <h2 class="text-primary-text font-medium text-lg mb-1">Settings</h2>
  <p class="text-secondary text-sm mb-8">Manage your app preferences</p>

  <div class="bg-card-bg border border-border rounded-lg p-6">
    <h3 class="text-primary-text font-medium mb-1">Theme</h3>
    <p class="text-secondary text-sm mb-5">Choose a color theme for the interface</p>

    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
      @for(theme of themes; track theme.id) {
      <div
        (click)="themeService.setTheme(theme.id)"
        class="relative rounded-lg p-3 cursor-pointer border transition-all duration-150"
        [ngClass]="themeService.activeThemeId() === theme.id
          ? 'border-primary'
          : 'border-border hover:border-secondary'">

        <!-- active check -->
        @if(themeService.activeThemeId() === theme.id) {
        <div class="absolute top-2 right-2 w-4 h-4 rounded-full bg-primary flex items-center justify-center">
          <svg width="8" height="8" viewBox="0 0 10 8" fill="none" stroke="white" stroke-width="2.5">
            <path d="M1 4l3 3 5-5"/>
          </svg>
        </div>
        }

        <!-- color dots -->
        <div class="flex gap-1.5 mb-2">
          <div class="w-3 h-3 rounded-full" [style.background]="theme.vars['--color-primary']"></div>
          <div class="w-3 h-3 rounded-full" [style.background]="theme.vars['--color-secondary2']"></div>
          <div class="w-3 h-3 rounded-full opacity-50" [style.background]="theme.vars['--color-secondary']"></div>
        </div>

        <!-- mini preview -->
        <div class="rounded p-2 mb-2" [style.background]="theme.vars['--color-primary-bg']">
          <div class="h-1.5 rounded mb-1.5 w-3/4" [style.background]="theme.vars['--color-primary']"></div>
          <div class="h-5 rounded mb-1" [style.background]="theme.vars['--color-card-bg']"
               [style.border]="'1px solid ' + theme.vars['--color-border']"></div>
          <div class="h-3 rounded w-1/2" [style.background]="theme.vars['--color-secondary2'] + '55'"></div>
        </div>

        <p class="text-xs font-medium text-primary-text">{{ theme.name }}</p>
        <p class="text-xs text-secondary">{{ theme.desc }}</p>
      </div>
      }
    </div>
  </div>
</div>
