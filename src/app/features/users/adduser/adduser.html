<app-generic-view-page [isActive]="true" type="user" [pageTitle]="pageTitleGetter">
    <div class="flex flex-col lg:flex lg:flex-row">
        <div class="grid grid-cols-1 pr-6 w-full lg:w-70.5 h-full lg:mt-18">
            <app-generic-child-nav-bar [navTitle]="navTitle" [navData]="addUserRoutesData"></app-generic-child-nav-bar>
        </div>
        <div class="flex flex-col flex-1 lg:pl-23 lg:mt-17.5 lg:border-l lg:border-l-gray-500/25  ">
            <router-outlet></router-outlet>
        </div>
    </div>
</app-generic-view-page>
