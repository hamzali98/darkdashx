<app-form-style formTitle="BASIC_INFO" formSubtitle="Please fill in user information">
    <form [formGroup]="basicInfo">

        <app-generic-input [config]="userPhoneConfig" formControlName="user_phone"
            [hasError]="user_phone?.hasError('required') && user_phone?.touched"
            [isInvalid]="user_phone?.hasError('minlength') || user_phone?.hasError('maxlength')"
            [isValid]="!!user_phone?.valid" />
        <app-generic-input [config]="userPositionConfig" formControlName="user_position"
            [hasError]="user_position?.hasError('required') && user_position?.touched"
            [isValid]="!!user_position?.valid" />
        <app-generic-input [config]="userLocationConfig" formControlName="user_location"
            [hasError]="user_location?.hasError('required') && user_location?.touched"
            [isValid]="!!user_location?.valid" />
        <app-generic-input [config]="userWebsiteConfig" formControlName="user_website"
            [hasError]="user_website?.hasError('required') && user_website?.touched"
            [isInvalid]="user_website?.hasError('pattern')" [isValid]="!!user_website?.valid" />
    </form>
</app-form-style>
