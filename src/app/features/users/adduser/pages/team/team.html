<form [formGroup]="teamInfo" (ngSubmit)="onFormSubmit()">
    <app-form-style formTitle="TEAM_INFO" formSubtitle="Please fill in user information">

        <app-generic-input [config]="userTeamNameConfig" formControlName="team_name"
            [hasError]="team_name?.hasError('required') && !!team_name?.touched" [isValid]="!!team_name?.valid" />

        <app-generic-input [config]="userTeamRankConfig" formControlName="team_rank"
            [hasError]="team_rank?.hasError('required') && team_rank?.touched" [isValid]="!!team_rank?.valid" />

        <app-generic-input [config]="userTeamOfficeConfig" formControlName="team_office"
            [hasError]="team_office?.hasError('required') && team_office?.touched" [isValid]="!!team_office?.valid" />

        <app-generic-input [config]="userTeamEmailConfig" formControlName="team_mail"
            [hasError]="team_mail?.hasError('required') && team_mail?.touched"
            [isInvalid]="team_mail?.hasError('invalidEmail')" [isValid]="!!team_mail?.valid" />
    </app-form-style>

    <div class="lg:pr-10.5 flex gap-2 justify-end">
        <app-text-button [btnDisable]="false" btntext="CANCEL" (btnClick)="onCancel()" />
        <app-submit-button btnType="submit" [btnDisable]="userFormSubmit.invalid"
            [btntext]="userformEditing ? ('Edit User'|translate) : ('Add User'|translate)" />
    </div>
</form>
