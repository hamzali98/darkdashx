        class="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 pointer-events-none" alt="icon" />
    <input class="ltr:pl-8  rtl:pr-8 w-full md:w-83 h-10 bg-card-bg border border-card-bg dark:border-gray-800 
    rounded-sm caret-primary outline-0
